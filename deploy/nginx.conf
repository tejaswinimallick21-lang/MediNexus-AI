# nginx site for MediNexus AI. setup_server.sh fills in __SERVER_NAME__ and __APP_DIR__;
# certbot then adds the HTTPS server block and the HTTP -> HTTPS redirect.
# The React build and the API share one origin, so the session cookie works without CORS.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __APP_DIR__/frontend/dist;
    index index.html;

    # Data Engineering uploads: up to 20 files of 50 MB each
    client_max_body_size 1100M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Hashed build assets can be cached; index.html must not be. (`expires`, not add_header, so the
    # security headers above still apply inside these blocks.)
    location /assets/ {
        expires 30d;
    }

    # Client-side routes (/doctor/patients/P_00001 ...) all load the React app
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
